name: Nifty50 Swing Trading System

# Triggers
on:
  workflow_dispatch:       # ✅ allows manual run
  schedule:
    - cron: '0 5 * * 1-5'  # Daily Mon-Fri at 5AM IST

jobs:
  run-trading-system:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Set Telegram secrets
      - name: Set Telegram Secrets
        run: |
          echo "TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}" >> $GITHUB_ENV
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> $GITHUB_ENV

      # 5️⃣ Run generate_signals.py
      - name: Generate Signals
        run: python src/generate_signals.py

      # 6️⃣ Run execute_trades.py
      - name: Execute Trades
        run: python src/execute_trades.py

      # 7️⃣ Run backtest.py
      - name: Run Backtest
        run: python src/backtest.py
