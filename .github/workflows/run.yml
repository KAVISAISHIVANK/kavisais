name: Run Trading System

on:
  schedule:
    - cron: "0 10 * * 1-5"   # Runs at 3:30 PM IST (market close)
  workflow_dispatch:         # Manual run button

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run signal generation
        run: python src/generate_signals.py

      - name: Run trade execution
        run: python src/execute_trades.py

      - name: Create dashboard
        run: python src/create_dashboard.py

      - name: Commit updated files
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@example.com"
          git add data/*.csv output/*.xlsx
          git commit -m "Auto update trading data" || echo "No changes"
          git push
